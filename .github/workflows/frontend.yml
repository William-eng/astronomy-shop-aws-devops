name: Astronomy Shop Frontend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/frontend.yml"
      - "app"
      - "iam/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')

          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null \
            | jq '{iss, aud, sub, repository, ref}'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::975050251876:role/AstronomyShopGitHubActionsECR
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push frontend
        working-directory: app
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build \
            -f src/frontend/Dockerfile \
            -t "$REGISTRY/astronomy-shop/frontend:$IMAGE_TAG" .
          docker push "$REGISTRY/astronomy-shop/frontend:$IMAGE_TAG"
