# Offline preparation only; live deployment is blocked by the $10/month budget.
default:
  image:
    tag: 3.1.0
  replicas: 1
  revisionHistoryLimit: 2
  schedulingRules:
    nodeSelector:
      kubernetes.io/os: linux
      kubernetes.io/arch: amd64
components:
  accounting:
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
    initContainers:
    - name: wait-for-kafka
      image: busybox:1.37.0
      command:
      - sh
      - -c
      - until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;
  ad:
    resources:
      requests:
        cpu: 50m
        memory: 300Mi
  agent:
    resources:
      requests:
        cpu: 50m
        memory: 500Mi
  cart:
    resources:
      requests:
        cpu: 50m
        memory: 160Mi
    initContainers:
    - name: wait-for-valkey-cart
      image: busybox:1.37.0
      command:
      - sh
      - -c
      - until nc -z -v -w30 valkey-cart 6379; do echo waiting for valkey-cart; sleep
        2; done;
  chatbot:
    resources:
      requests:
        cpu: 50m
        memory: 500Mi
  checkout:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
    initContainers:
    - name: wait-for-kafka
      image: busybox:1.37.0
      command:
      - sh
      - -c
      - until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;
  currency:
    resources:
      requests:
        cpu: 50m
        memory: 20Mi
  email:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
  fraud-detection:
    resources:
      requests:
        cpu: 50m
        memory: 300Mi
    initContainers:
    - name: wait-for-kafka
      image: busybox:1.37.0
      command:
      - sh
      - -c
      - until nc -z -v -w30 kafka 9092; do echo waiting for kafka; sleep 2; done;
  frontend:
    resources:
      requests:
        cpu: 50m
        memory: 250Mi
    imageOverride:
      repository: 975050251876.dkr.ecr.us-east-1.amazonaws.com/astronomy-shop/frontend
      tag: a7da32eafe17bc72a9cfca69f1230dcfc23a73e0@sha256:abfa1fee95bcee4da40f78865026312714f533c009ed9fab479d1a575e6d3c89
    envOverrides:
    - name: ENV_PLATFORM
      value: aws
    - name: PUBLIC_OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
      value: http://localhost:8080/otlp-http/v1/traces
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 5
  frontend-proxy:
    resources:
      requests:
        cpu: 50m
        memory: 90Mi
    service:
      type: ClusterIP
      port: 8080
    ingress:
      enabled: false
  image-provider:
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
  load-generator:
    resources:
      requests:
        cpu: 50m
        memory: 1500Mi
    envOverrides:
    - name: LOCUST_AUTOSTART
      value: 'false'
    - name: LOCUST_USERS
      value: '1'
    - name: LOCUST_BROWSER_TRAFFIC_ENABLED
      value: 'false'
  mcp:
    resources:
      requests:
        cpu: 50m
        memory: 500Mi
  payment:
    resources:
      requests:
        cpu: 50m
        memory: 140Mi
  product-catalog:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
    initContainers:
    - name: wait-for-astronomy-db
      image: busybox:1.37.0
      command:
      - sh
      - -c
      - until nc -z -v -w30 astronomy-db 5432; do echo waiting for astronomy-db; sleep
        2; done;
  quote:
    resources:
      requests:
        cpu: 50m
        memory: 40Mi
  recommendation:
    resources:
      requests:
        cpu: 50m
        memory: 500Mi
  shipping:
    resources:
      requests:
        cpu: 50m
        memory: 20Mi
    initContainers:
    - name: wait-for-flagd
      image: busybox:1.37.0
      command:
      - sh
      - -c
      - until nc -z -v -w30 flagd 8013; do echo waiting for flagd; sleep 2; done;
  flagd:
    resources:
      requests:
        cpu: 50m
        memory: 75Mi
    initContainers:
    - name: init-config
      image: busybox:1.37.0
      command:
      - sh
      - -c
      - cp /config-ro/demo.flagd.json /config-rw/demo.flagd.json && cat /config-rw/demo.flagd.json
      volumeMounts:
      - mountPath: /config-ro
        name: config-ro
      - mountPath: /config-rw
        name: config-rw
  kafka:
    resources:
      requests:
        cpu: 50m
        memory: 700Mi
  astronomy-db:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
  valkey-cart:
    resources:
      requests:
        cpu: 50m
        memory: 20Mi
  telemetry-docs:
    resources:
      requests:
        cpu: 50m
        memory: 100Mi
  opamp-server:
    resources:
      requests:
        cpu: 50m
        memory: 65Mi
grafana:
  persistence:
    enabled: false
prometheus:
  server:
    persistentVolume:
      enabled: false
    retention: 1d
opensearch:
  persistence:
    enabled: false
  resources:
    requests:
      memory: 1100Mi
      cpu: 1000m
